# cargo-deny configuration.
#
# Run locally with `cargo deny check`. CI runs this on every push.
# Format documented at https://embarkstudios.github.io/cargo-deny/.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-pc-windows-gnu" },
]
all-features = false
no-default-features = false

[advisories]
# Deny any package with an *actual* security advisory. "Unmaintained"
# advisories are flagged but not enforced because they rarely reflect
# exploitable bugs and they can sit in the advisory DB for years
# while the upstream crate works fine for our use case.
version = 2
yanked = "warn"
ignore = [
    # paste — no longer maintained, pulled in transitively via
    # ratatui/compact_str. No replacement has shipped upstream yet.
    "RUSTSEC-2024-0436",
    # unmaintained instability / time-core chain flagged in 2026;
    # tracked upstream, no exploitable surface in our parsers.
    "RUSTSEC-2026-0002",
]

[licenses]
# Whitelist only permissive licenses compatible with MIT. Anything
# else is a hard fail so a surprise dependency can't quietly pull in
# a copyleft licence.
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]

[bans]
# Duplicate crates are allowed but flagged — usually this is proc-macro
# pulls that can't be avoided. We run cargo-deny in CI with
# `--deny warnings` OFF so the audit workflow doesn't fail on transitive
# duplicates we can't fix (see audit.yml).
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
