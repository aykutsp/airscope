[package]
name                  = "xtask"
version               = "0.0.0"
edition.workspace     = true
rust-version.workspace = true
publish               = false
description           = "in-tree build scripts for the Airscope workspace"

# Keep this crate's dep tree separate from the rest of the workspace:
# nothing in xtask should creep into a released binary. Everything is
# in `dev` territory.
[dependencies]
anyhow        = { workspace = true }
clap          = { workspace = true }
clap_complete = "4.5"
clap_mangen   = "0.3"
