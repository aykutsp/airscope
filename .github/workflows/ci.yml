name: ci

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: cargo check / clippy / test (no live)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
      - name: build sample demo
        run: cargo run -p airscope-wifi --example make_sample
      - name: exercise airodump on the sample
        shell: bash
        run: |
          cargo run -p airscope-airodump -- --no-tui --read samples/demo-01.pcap --duration 1 --rate 100

  live-linux:
    name: linux + live capture feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: cargo clippy --features live
        run: |
          cargo clippy \
            --workspace --all-targets \
            --features "airscope-airodump/live airscope-airmon/live airscope-aireplay/live airscope-airbase/live" \
            -- -D warnings
      - name: cargo build --features live
        run: |
          cargo build --workspace \
            --features "airscope-airodump/live airscope-airmon/live airscope-aireplay/live airscope-airbase/live"

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        # Clippy is intentionally skipped here — new lints land in every
        # release and we don't want MSRV to fight with the latest toolchain.
        run: cargo check --workspace --all-targets

  bench-compile:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check --benches
        run: cargo check -p airscope-wifi --benches
