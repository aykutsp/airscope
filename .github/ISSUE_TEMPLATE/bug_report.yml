name: bug report
description: something airscope does wrong, or does but shouldn't
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill out what applies — empty
        sections are fine if the field doesn't make sense for your
        report.

        If this is a **security** issue (parser crash on a crafted
        pcap, command injection in the hopper, etc.) please report it
        privately via Security Advisories instead:
        <https://github.com/aykutsp/airscope/security/advisories/new>

  - type: input
    id: version
    attributes:
      label: airscope version
      description: Output of `airscope --version` or `git rev-parse HEAD`.
      placeholder: "0.2.0 / 28f0534"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (MSVC)
        - Windows (MinGW)
        - Other
    validations:
      required: true

  - type: dropdown
    id: feature
    attributes:
      label: Was the `live` feature enabled?
      options:
        - "No — default build"
        - "Yes — built with --features live"
        - "Not sure"
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe what you did and what you expected.
      placeholder: |
        Ran `airodump -r foo.pcap` and it ...
        Expected it to ... but instead it ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact commands. If you have a pcap that triggers it, attach it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any panics, backtraces, or relevant stderr output.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues before filing this.
          required: true
        - label: I'm not reporting a security vulnerability.
          required: true
